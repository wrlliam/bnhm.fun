# Development with hot reload:
#   docker compose -f docker-compose.dev.yml up --build
# Source is mounted; node_modules and .next stay inside the container.

name: bnhm-fun-dev

services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    env_file:
      - path: .env
        required: false
    environment:
      # phones on your Wi-Fi reach the dev server via your computer's IP; list it here
      ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
