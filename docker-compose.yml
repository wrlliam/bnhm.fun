# Production:
#   docker compose up -d --build                    → app on http://localhost:${PORT:-3000}
#   docker compose --profile proxy up -d --build    → plus Caddy on :80/:443 (HTTPS if DOMAIN is set)
#   docker compose --profile tunnel up -d --build   → plus a public https://*.trycloudflare.com URL
#                                                     (no domain or port-forwarding needed)
# Run a single app replica: rooms are kept in memory.

name: bnhm-fun

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://bnhm.fun}
    image: bnhm-fun:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Instant public URL through Cloudflare, no account needed. The URL is printed
  # in the logs:  docker compose logs tunnel | grep trycloudflare
  # For a permanent URL on your own domain, create a named tunnel in the
  # Cloudflare dashboard and use:  command: tunnel --no-autoupdate run --token <token>
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # http2 over TCP: works on networks that block QUIC/UDP
    command: tunnel --no-autoupdate --protocol http2 --url http://app:3000

volumes:
  caddy_data:
  caddy_config:
